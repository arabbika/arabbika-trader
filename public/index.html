<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Arabbika Trader | Smart Pricing</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --bg: #0f1115; --surface: #1a1d24; --text: #ffffff; --muted: #8b92a5;
      --accent: #00d26a; --accent-hover: #00b359;
      --danger: #ff4757; --warning: #facc15;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', -apple-system, sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
    main { max-width: 480px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; padding-top: 20px; }
    .logo { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .logo span { color: var(--accent); }
    header p { font-size: 14px; color: var(--muted); margin-top: 6px; }
    .card { background: var(--surface); padding: 24px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); border: 1px solid var(--border); }
    .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; margin-bottom: 12px; margin-top: 20px; display: block; }
    .section-label:first-of-type { margin-top: 0; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 8px; }
    .input-group input, .input-group select { width: 100%; padding: 14px 16px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 16px; font-weight: 500; transition: all 0.2s ease; }
    .input-group input:focus, .input-group select:focus { outline: none; border-color: var(--accent); background: rgba(0, 210, 106, 0.05); }
    .input-group input::placeholder { color: #4a5266; }
    .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { width: 100%; padding: 16px; background: var(--accent); color: #000; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.1s, background 0.2s; margin-top: 24px; }
    button:active { transform: scale(0.98); }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    .result-card { display: none; background: var(--surface); padding: 24px; border-radius: 20px; margin-top: 20px; border: 1px solid var(--accent); box-shadow: 0 10px 30px rgba(0, 210, 106, 0.1); animation: slideUp 0.4s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .price-label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; text-align: center; }
    .price-tag { font-size: 48px; font-weight: 800; color: var(--accent); text-align: center; margin: 8px 0; letter-spacing: -1px; }
    
    #alert-box { padding: 16px; border-radius: 12px; margin-bottom: 24px; display: none; }
    #alert-text { font-weight: 600; font-size: 14px; text-align: center; }
    .alert-loss { background: rgba(255, 71, 87, 0.1); border: 1px solid var(--danger); color: var(--danger); }
    .alert-target { background: rgba(250, 204, 21, 0.1); border: 1px solid var(--warning); color: var(--warning); }

    #flyer-canvas-target { background: #111; padding: 30px; border-radius: 16px; margin-top: 20px; text-align: center; border: 2px solid var(--accent); }
    .copy-btn { background: #25D366; color: white; margin-top: 16px; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .copy-btn:hover { background: #20bd5a; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="logo">Arabbika <span>Trader</span></div>
      <p>The smart pricing engine for side hustles.</p>
    </header>

    <div class="card">
      <span class="section-label">Product Details</span>
      <div class="input-group">
        <label>What are you selling?</label>
        <input type="text" id="item-name" placeholder="e.g., Hair Extensions, Sneakers">
      </div>
      <span class="section-label">Cost Breakdown</span>
      <div class="input-group">
        <label>Wholesale Cost per Unit (R)</label>
        <input type="number" id="wholesale-cost" placeholder="e.g., 50" min="1">
      </div>
      <div class="input-grid">
        <div class="input-group">
          <label>Transport (per trip) (R)</label>
          <input type="number" id="transport-trip" placeholder="e.g., 60" min="0">
        </div>
        <div class="input-group">
          <label>Units per trip</label>
          <input type="number" id="units-trip" placeholder="e.g., 10" min="1">
        </div>
      </div>
      <div class="input-grid">
        <div class="input-group">
          <label>Data/Airtime weekly (R)</label>
          <input type="number" id="data-week" placeholder="e.g., 50" min="0">
        </div>
        <div class="input-group">
          <label>Sales per week</label>
          <input type="number" id="sales-week" placeholder="e.g., 20" min="1">
        </div>
      </div>
      <span class="section-label">Profit Target</span>
      <div class="input-grid">
        <div class="input-group">
          <label>Shrinkage / Loss (%)</label>
          <input type="number" id="shrinkage" placeholder="e.g., 5" value="5" min="0" max="99">
        </div>
        <div class="input-group">
          <label>Target Margin (%)</label>
          <input type="number" id="margin" placeholder="e.g., 50" value="50" min="1" max="99">
        </div>
      </div>
      <span class="section-label">Check Your Current Price</span>
      <div class="input-grid">
        <div class="input-group">
          <label>Current Selling Price (R)</label>
          <input type="number" id="current-price" placeholder="e.g., 40" min="0">
        </div>
        <div class="input-group">
          <label>Sales per week</label>
          <input type="number" id="weekly-volume" placeholder="e.g., 10" min="1">
        </div>
      </div>
      <div class="input-group" style="margin-top: 20px;">
        <label>Flyer Theme</label>
        <select id="flyer-theme">
          <option value="standard">Standard (Everyday)</option>
          <option value="blackfriday">Black Friday Special</option>
          <option value="festive">Festive Season Special</option>
        </select>
      </div>
      <button id="calc-btn">Calculate & Generate Flyer</button>
    </div>

    <div id="result-box" class="result-card">
      <div class="price-label">Recommended Selling Price</div>
      <div id="res-selling-price" class="price-tag">R0.00</div>
      
      <div id="alert-box">
        <p id="alert-text"></p>
      </div>

      <div id="flyer-canvas-target">
        <h2 id="flyer-theme-title" style="color: var(--accent); font-size: 24px; margin-bottom: 10px;">✦ PREMIUM STOCK ✦</h2>
        <h3 id="flyer-item-name" style="color: white; font-size: 20px; margin-bottom: 20px;">Item Name</h3>
        <div style="background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-bottom: 15px;">
          <p style="color: #ccc; font-size: 12px; text-transform: uppercase;">Single Item</p>
          <p id="flyer-single-price" style="color: white; font-size: 32px; font-weight: bold;">R0.00</p>
        </div>
        <p id="flyer-bulk-price" style="color: #00d26a; font-size: 14px; font-weight: 600;">Bulk (3+): R0.00 each</p>
        <p style="color: #888; font-size: 12px; margin-top: 20px;">DM to order 📍</p>
        <p style="color: #555; font-size: 10px; margin-top: 10px;">Priced with Arabbika Trader</p>
      </div>
      
      <button class="copy-btn" onclick="shareFlyerImage()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
        Share Flyer to WhatsApp
      </button>
    </div>
  </main>

  <script>
    const inputs = ['item-name', 'wholesale-cost', 'transport-trip', 'units-trip', 'data-week', 'sales-week', 'shrinkage', 'margin', 'current-price', 'weekly-volume', 'flyer-theme'];
    
    window.addEventListener('DOMContentLoaded', () => {
      inputs.forEach(id => {
        const saved = localStorage.getItem('trader_' + id);
        if (saved) document.getElementById(id).value = saved;
      });
    });

    inputs.forEach(id => {
      document.getElementById(id).addEventListener('input', (e) => {
        localStorage.setItem('trader_' + id, e.target.value);
      });
    });

    document.getElementById('calc-btn').addEventListener('click', async () => {
      const itemName = document.getElementById('item-name').value;
      const wholesaleCost = document.getElementById('wholesale-cost').value;
      const transportPerTrip = document.getElementById('transport-trip').value;
      const unitsPerTrip = document.getElementById('units-trip').value;
      const dataPerWeek = document.getElementById('data-week').value;
      const weeklySales = document.getElementById('sales-week').value;
      const shrinkage = document.getElementById('shrinkage').value;
      const desiredMargin = document.getElementById('margin').value;
      const currentPrice = document.getElementById('current-price').value;
      const weeklyVolume = document.getElementById('weekly-volume').value;
      const theme = document.getElementById('flyer-theme').value;

      if(!itemName || !wholesaleCost) return alert('Please fill in the item name and wholesale cost.');

      const btn = document.getElementById('calc-btn');
      btn.disabled = true; btn.textContent = 'Calculating...';

      try {
        const res = await fetch('/api/calculate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            itemName, wholesaleCost, transportPerTrip, unitsPerTrip, 
            dataPerWeek, weeklySales, shrinkage, desiredMargin, currentPrice, weeklyVolume, theme 
          })
        });
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error);

        document.getElementById('res-selling-price').textContent = `R${data.sellingPrice}`;
        document.getElementById('flyer-item-name').textContent = itemName;
        document.getElementById('flyer-single-price').textContent = `R${data.sellingPrice}`;
        document.getElementById('flyer-bulk-price').textContent = `Bulk (3+): R${data.bulkPrice} each`;
        
        const titleEl = document.getElementById('flyer-theme-title');
        if(theme === 'blackfriday') titleEl.textContent = "🔥 BLACK FRIDAY DEAL 🔥";
        else if(theme === 'festive') titleEl.textContent = "🎄 FESTIVE SPECIAL 🎄";
        else titleEl.textContent = "✦ PREMIUM STOCK ✦";

        // 🔴 FIX: Handle separate Loss vs Under Target alerts
        const alertBox = document.getElementById('alert-box');
        const alertText = document.getElementById('alert-text');
        
        if (data.alertType === 'loss') {
          alertText.textContent = `⚠️ ${data.alertMessage}`;
          alertBox.className = 'alert-loss';
          alertBox.style.display = 'block';
        } else if (data.alertType === 'under_target') {
          alertText.textContent = `💡 ${data.alertMessage}`;
          alertBox.className = 'alert-target';
          alertBox.style.display = 'block';
        } else {
          alertBox.style.display = 'none';
        }
        
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('result-box').scrollIntoView({ behavior: 'smooth', block: 'end' });
      } catch (err) {
        alert(err.message || 'Error calculating. Please try again.');
      } finally {
        btn.disabled = false; btn.textContent = 'Calculate & Generate Flyer';
      }
    });

    async function shareFlyerImage() {
      const flyerTarget = document.getElementById('flyer-canvas-target');
      const btn = document.querySelector('.copy-btn');
      const originalText = btn.innerHTML;
      
      btn.innerHTML = 'Generating Image...';
      btn.disabled = true;

      try {
        const canvas = await html2canvas(flyerTarget, { backgroundColor: '#111', scale: 2 });
        
        canvas.toBlob(async (blob) => {
          const file = new File([blob], 'arabbika-flyer.png', { type: 'image/png' });
          
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: 'My Arabbika Flyer',
              text: 'Check out my latest stock!'
            });
          } else {
            const link = document.createElement('a');
            link.download = 'arabbika-flyer.png';
            link.href = canvas.toDataURL();
            link.click();
            alert('Image downloaded! You can now post it to your WhatsApp Status.');
          }
          
          btn.innerHTML = originalText;
          btn.disabled = false;
        }, 'image/png');
      } catch (err) {
        alert('Failed to generate image.');
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
