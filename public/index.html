<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Arabbika Trader | Smart Pricing</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="glow"></div>
  
  <main>
    <header>
      <div class="logo">Arabbika <span>Trader</span></div>
      <p>The smart pricing engine for side hustles.</p>
    </header>

    <div class="card">
      <span class="section-label">Product Details</span>
      <div class="input-group">
        <label>What are you selling?</label>
        <input type="text" id="item-name" placeholder="e.g., Hair Extensions, Sneakers, Cakes" maxlength="60">
      </div>

      <span class="section-label">Cost Breakdown</span>
      <div class="input-group">
        <label>Wholesale Cost per Unit (R)</label>
        <input type="number" id="wholesale-cost" placeholder="e.g., 50" min="1">
      </div>

      <div class="input-grid">
        <div class="input-group">
          <label>Transport (per trip) (R)</label>
          <input type="number" id="transport-trip" placeholder="e.g., 60" min="0">
        </div>
        <div class="input-group">
          <label>Units per trip</label>
          <input type="number" id="units-trip" placeholder="e.g., 10" min="1">
        </div>
      </div>

      <div class="input-grid">
        <div class="input-group">
          <label>Data/Airtime weekly (R)</label>
          <input type="number" id="data-week" placeholder="e.g., 50" min="0">
        </div>
        <div class="input-group">
          <label>Sales per week</label>
          <input type="number" id="sales-week" placeholder="e.g., 20" min="1">
        </div>
      </div>

      <span class="section-label">Profit Target</span>
      <div class="input-grid">
        <div class="input-group">
          <label>Shrinkage / Loss (%)</label>
          <input type="number" id="shrinkage" placeholder="e.g., 5" value="5" min="0" max="90">
        </div>
        <div class="input-group">
          <label>Target Margin (%)</label>
          <input type="number" id="margin" placeholder="e.g., 50" value="50" min="1" max="94">
        </div>
      </div>

      <span class="section-label">Are you selling at a loss?</span>
      <div class="input-grid">
        <div class="input-group">
          <label>Current Selling Price (R)</label>
          <input type="number" id="current-price" placeholder="e.g., 40" min="0">
        </div>
        <div class="input-group">
          <label>Sales per week</label>
          <input type="number" id="weekly-volume" placeholder="e.g., 10" min="1">
        </div>
      </div>

      <div class="input-group" style="margin-top: 20px;">
        <label>Flyer Theme</label>
        <select id="flyer-theme">
          <option value="standard">Standard (Everyday)</option>
          <option value="blackfriday">Black Friday Special</option>
          <option value="festive">Festive Season Special</option>
        </select>
      </div>

      <button id="calc-btn" class="btn-primary">Calculate & Generate Flyer</button>
    </div>

    <div id="result-box" class="result-card">
      <div class="price-label">Recommended Selling Price</div>
      <div id="res-selling-price" class="price-tag">R0.00</div>
      
      <div id="profit-leak-box" class="alert-box" style="display: none;">
        <p id="profit-leak-text"></p>
      </div>

      <div id="flyer-canvas-target">
        <h2 id="flyer-theme-title" class="flyer-theme">✦ PREMIUM STOCK ✦</h2>
        <h3 id="flyer-item-name" class="flyer-title">Item Name</h3>
        <div class="flyer-price-box">
          <p class="flyer-price-label">Single Item</p>
          <p id="flyer-single-price" class="flyer-price">R0.00</p>
        </div>
        <p id="flyer-bulk-price" class="flyer-bulk">Bulk (3+): R0.00 each</p>
        <p class="flyer-dm">DM to order 📍</p>
        <p class="flyer-watermark">Priced with Arabbika Trader</p>
      </div>

      <button onclick="shareFlyerImage()" class="copy-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
        Share Flyer to WhatsApp
      </button>
      <button id="save-btn" class="btn-secondary" style="margin-top: 10px;">Save Product to List</button>
    </div>
  </main>

  <!-- Toast Container -->
  <div id="toast-container">
    <span style="color: #00d26a; font-weight: bold;">✓</span> <span id="toast-message">Copied!</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
